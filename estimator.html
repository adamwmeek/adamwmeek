<html>
    <head>
        <title>Project Time Estimator</title>

        <script>
        function addItem() {
            const input = document.getElementById("nameInput");
            const item = input.value.trim();

            const hrs_text = document.getElementById("hoursInput").value;

            if (!item) return;

            const li = document.createElement("li");
            li.textContent = item + " - " + hrs_text + " hrs";
            document.getElementById("itemList").appendChild(li);
            input.value = "";

            var subtotal = Number(document.getElementById("subTotal").value);
            var added_hrs = Number(hrs_text);

            subtotal += added_hrs;
            document.getElementById("subTotal").value = subtotal;
        }

        function updateHours() {
            var subtotal = Number(document.getElementById("subTotal").value);
            var research_hours = Number(event.target.value);
            
            var total = subtotal + research_hours;

            document.getElementById("total").value = total;
        }

        document.getElementById("comps").addEventListener("change", (event) => {
            document.getElementById("nameInput").value = event.target.text;
            document.getElementById("hoursInput").value = event.target.value;
        });

        document.getElementById("research").addEventListener("change", (event) => {
            updateHours();
        });

        document.getElementById("subTotal").addEventListener("change", (event) => {
            updateHours();
        });

    </script>
    </head>
    <body>
        <h4>Project components:</h4>
            <div>
            <select id="comps">
                <option value="5">Single file python script</option>
                <option value="10">Basic Embedded System</option>
                <option value="20">Embedded System with radio</option>

                <option value="15">Basic Raspberry Pi</option>

                <option value="15">Single page website with JavaScript</option>
                <option value="5">Additional website page</option>

                <option value="20">Database setup/maintenance</option>
                <option value="20">Server configuration</option>

                <option value="30">Single task AI agent</option>
                <option value="10">Additional tool for agent</option>

                <option value="40">C# Project</option>
                <option value="10">C# Single UI page</option>
            </select>
            </div>
            <div>
                <input id="nameInput" size="50">
                <input id="hoursInput" size="4" placeholder="0">
                <button onclick="addItem()">Add item</button>
                <ul id="itemList"></ul>
                <p>Subtotal:</p><input type="text" value="0" name="subTotal" readonly>
            </div>
        <h4>Research needed:</h4>
        <div>
            <h5>Level of familiarity:</h5>
            <select id="research">
                <option value="5">Very familiar</option>
                <option value="10">Somewhat familiar</option>
                <option value="20">Heard of it</option>
                <option value="40">Unknown to me</option>
            </select>
        </div>
        <p>Total:</p><input type="text" value="0" name="total" readonly>
    </body>
</html>
